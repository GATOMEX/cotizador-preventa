<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotizador Preventa — AWM</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Cotizador Preventa</strong>
      <span class="muted">AWM Sistemas de Seguridad</span>
    </div>
    <div class="topbar-actions">
      <span id="odooStatus" class="pill pill-warn">Odoo: sin cargar</span>
      <span id="catStatus" class="pill pill-warn">Listas: 0</span>
      <input type="file" id="odooFile" accept=".xlsx,.xls" hidden />
      <input type="file" id="catFile" accept=".xlsx,.xls" multiple hidden />
      <button id="odooBtn" class="btn">Cargar Odoo…</button>
      <button id="catBtn" class="btn">Cargar listas de precios…</button>
      <button id="exportBtn" class="btn btn-primary">Exportar Excel</button>
    </div>
  </header>

  <main class="wrap">
    <section class="meta card">
      <div class="grid-3">
        <label>Cliente
          <input id="metaCliente" type="text" placeholder="Nombre del cliente" />
        </label>
        <label>Tipo de proyecto
          <input id="metaTipo" type="text" placeholder="CCTV, control de acceso, alarma…" />
        </label>
        <label>Vendedor
          <input id="metaVendedor" type="text" placeholder="Vendedor que trajo la op." />
        </label>
        <label>Fecha
          <input id="metaFecha" type="date" />
        </label>
        <label>Tasa USD mercado
          <div class="inline">
            <span class="prefix">DO$</span>
            <input id="tasaMercado" type="number" step="0.01" min="0" value="60" />
          </div>
        </label>
        <label>Tasa aplicada (+2)
          <div class="inline">
            <span class="prefix">DO$</span>
            <input id="tasaAplicada" type="text" value="62.00" readonly />
          </div>
        </label>
        <label>Margen general (markup)
          <div class="inline">
            <input id="marginGlobal" type="number" step="1" min="0" value="60" />
            <span class="suffix">%</span>
            <button id="applyMarginAll" class="btn btn-sm" title="Aplicar a líneas NO importadas">Aplicar</button>
          </div>
        </label>
        <label class="span-2">Consideraciones especiales del proyecto
          <textarea id="metaConsideraciones" rows="2"
            placeholder="Notas, exclusiones, condiciones de instalación, vigencia de la oferta…"></textarea>
        </label>
      </div>
      <div class="hint muted">
        Importado = margen 90% · General = margen 60%. Precios en USD se convierten a DOP con la tasa aplicada.
      </div>
    </section>

    <div id="blocks"></div>

    <section class="card totals">
      <div class="totals-grid">
        <div><span class="muted">Costo total</span><strong id="tCosto">RD$ 0.00</strong></div>
        <div><span class="muted">Venta total</span><strong id="tVenta">RD$ 0.00</strong></div>
        <div><span class="muted">Utilidad</span><strong id="tUtil">RD$ 0.00</strong></div>
        <div><span class="muted">Margen efectivo</span><strong id="tMargen">0%</strong></div>
      </div>
    </section>
  </main>

  <datalist id="odooList"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

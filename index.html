<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotizador Preventa — AWM</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Cotizador Preventa</strong>
      <span class="muted">AWM Sistemas de Seguridad</span>
    </div>
    <div class="topbar-actions">
      <label class="odoo-load">
        <span id="odooStatus" class="pill pill-warn">Odoo: sin cargar</span>
        <input type="file" id="odooFile" accept=".xlsx,.xls" hidden />
        <button id="odooBtn" class="btn">Cargar inventario Odoo…</button>
      </label>
      <button id="exportBtn" class="btn btn-primary">Exportar Excel</button>
    </div>
  </header>

  <main class="wrap">
    <section class="meta card">
      <div class="grid-2">
        <label>Cliente
          <input id="metaCliente" type="text" placeholder="Nombre del cliente" />
        </label>
        <label>Proyecto / Oportunidad
          <input id="metaProyecto" type="text" placeholder="Ref. de la oportunidad" />
        </label>
        <label>Vendedor
          <input id="metaVendedor" type="text" placeholder="Vendedor que trajo la op." />
        </label>
        <label>Margen global (markup s/ costo)
          <div class="inline">
            <input id="marginGlobal" type="number" step="1" min="0" value="30" />
            <span class="suffix">%</span>
            <button id="applyMarginAll" class="btn btn-sm" title="Aplicar a todas las líneas">Aplicar a todo</button>
          </div>
        </label>
      </div>
    </section>

    <div id="blocks"></div>

    <section class="card totals">
      <div class="totals-grid">
        <div><span class="muted">Costo total</span><strong id="tCosto">RD$ 0.00</strong></div>
        <div><span class="muted">Venta total</span><strong id="tVenta">RD$ 0.00</strong></div>
        <div><span class="muted">Utilidad</span><strong id="tUtil">RD$ 0.00</strong></div>
        <div><span class="muted">Margen efectivo</span><strong id="tMargen">0%</strong></div>
      </div>
    </section>
  </main>

  <!-- datalist de productos Odoo (autocompletar por nombre) -->
  <datalist id="odooList"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
